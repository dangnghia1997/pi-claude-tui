name: Release

# Publishing is driven by tags so npm and GitHub can never disagree about what
# is current: push a tag -> verify -> publish to npm -> create the GitHub Release.
# Safe to re-run: if the version is already on npm the publish step is skipped,
# which lets you backfill the GitHub Release for an older tag via workflow_dispatch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.0
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # contents: write -> create the GitHub Release
      # id-token: write -> npm provenance / OIDC trusted publishing
      contents: write
      id-token: write
    env:
      # Job-level so steps can test it with `if: env.NPM_TOKEN != ''`
      # (the secrets context is not allowed in `if:` expressions).
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Resolve tag
        id: ref
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # No registry-url on purpose: setup-node would write an .npmrc with an
      # empty _authToken placeholder, which shadows OIDC trusted publishing.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm >= 11.5 is required for OIDC trusted publishing.
      - name: Use latest npm
        run: npm install -g npm@latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "$version" != "$VERSION" ]; then
            echo "::error::tag v$VERSION does not match package.json version $version"
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check publish credentials
        run: |
          echo "npm $(npm -v) on node $(node -v)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::notice::OIDC id-token available: npm trusted publishing can be used"
          else
            echo "::warning::No id-token request URL. Verify the job has 'id-token: write'."
          fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret is set, token auth will be used"
          else
            echo "::notice::NPM_TOKEN secret is empty, publish relies on npm trusted publishing"
          fi

      # Only write an .npmrc when a token exists, so the OIDC path stays clean.
      - name: Configure npm token
        if: env.NPM_TOKEN != ''
        run: npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN" --location=user

      - name: Publish to npm
        env:
          VERSION: ${{ steps.ref.outputs.version }}
          # Preferred: configure a GitHub Actions trusted publisher for this
          # workflow on npmjs.com and leave the NPM_TOKEN secret unset (OIDC).
          # Trusted publisher settings must match exactly:
          #   organization/user: dangnghia1997
          #   repository:        pi-claude-tui
          #   workflow filename: release.yml
          #   environment:       (leave blank)
          # Fallback: a granular npm token with publish rights in NPM_TOKEN
          # (written into .npmrc by the step above, if the secret is set).
        run: |
          name="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$name@$VERSION is already on npm, skipping publish"
            exit 0
          fi
          # --loglevel verbose is required to surface OIDC failures: npm logs the
          # trusted-publishing token exchange only at verbose level. Without it a
          # misconfigured trusted publisher looks like a bare ENEEDAUTH.
          npm publish --access public --provenance --loglevel verbose

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists, skipping"
            exit 0
          fi
          gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            --title "$TAG"
