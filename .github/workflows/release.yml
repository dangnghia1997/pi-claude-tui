name: Release

# CI does not publish to npm. npm requires a 2FA one-time password to publish
# and rejects tokens for unattended publishing (HTTP 401 / EOTP), so publishing
# is a local step:
#
#   npm version patch && npm publish && git push --follow-tags
#
# This workflow mirrors the pushed tag into a GitHub Release and reports whether
# the tagged version is actually live on npm. It holds no npm credentials.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v0.1.2
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Resolve tag
        id: ref
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "$version" != "$VERSION" ]; then
            echo "::error::tag v$VERSION does not match package.json version $version"
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Advisory only: the tag may be pushed before the local `npm publish`.
      - name: Report npm state
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          name="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$name@$VERSION is live on npm"
          else
            echo "::warning title=not on npm yet::$name@$VERSION is not on npm. Publish it locally with 'npm publish' (needs a 2FA code) to match this tag and Release."
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists, skipping"
            exit 0
          fi
          gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            --title "$TAG"
